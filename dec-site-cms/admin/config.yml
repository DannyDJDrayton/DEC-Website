backend:
  name: git-gateway
  branch: main

media_folder: "dec-site-cms/content/uploads"
public_folder: "/content/uploads"

collections:
  - name: "site_settings"
    label: "Site Photos & Phone Number"
    files:
      - file: "dec-site-cms/content/settings.json"
        label: "Homepage Settings"
        name: "settings"
        fields:
          - { label: "Phone Number", name: "phone", widget: "string", required: false, hint: "e.g. 07788 123456" }
          - { label: "Hero Photo (right side of homepage)", name: "heroImage", widget: "image", required: false }
          - { label: "Van Photo (in the black 'Why Choose DEC' section)", name: "vanImage", widget: "image", required: false }

  - name: "blog"
    label: "Blog Posts"
    files:
      - file: "dec-site-cms/content/posts.json"
        label: "All Blog Posts"
        name: "posts"
        fields:
          - label: "Posts"
            name: "blog"
            widget: "list"
            summary: "{{title}}"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Web address name (optional)", name: "slug", widget: "string", required: false, hint: "Leave blank and it's made from the title, e.g. /blog/hard-water-and-streaky-windows/. Once you've shared a post, don't change this or old links will break." }
              - { label: "Date", name: "date", widget: "datetime", format: "YYYY-MM-DD", date_format: "D MMM YYYY" }
              - { label: "Read time (e.g. '5 min read')", name: "readtime", widget: "string", default: "5 min read" }
              - { label: "Short excerpt (shown on the blog list AND in the preview when the link is shared)", name: "excerpt", widget: "text", hint: "One or two sentences, under about 155 characters." }
              - { label: "Cover image (optional)", name: "image", widget: "image", required: false, hint: "Shown at the top of the post. Resize phone photos to about 1600px wide first." }
              - { label: "Share image (optional, 1200 x 630)", name: "share_image", widget: "image", required: false, hint: "The picture people see when you share the link on Facebook or WhatsApp. Leave blank to use the cover image, or the DEC logo image." }
              - { label: "Hide this post (draft)", name: "draft", widget: "boolean", default: false, required: false }
              - { label: "Body", name: "body", widget: "markdown" }

  - name: "gallery"
    label: "Before & After Gallery"
    files:
      - file: "dec-site-cms/content/gallery.json"
        label: "Gallery Items"
        name: "gallery"
        fields:
          - label: "Items"
            name: "items"
            widget: "list"
            summary: "{{caption}}"
            fields:
              - { label: "Before Photo", name: "before_image", widget: "image" }
              - { label: "After Photo", name: "after_image", widget: "image" }
              - { label: "Caption (e.g. 'Semi-detached, Sovereign Park')", name: "caption", widget: "string", required: false }

  - name: "testimonials"
    label: "Reviews / Testimonials"
    files:
      - file: "dec-site-cms/content/testimonials.json"
        label: "Reviews"
        name: "testimonials"
        fields:
          - label: "Reviews"
            name: "items"
            widget: "list"
            summary: "{{name}} — {{quote}}"
            fields:
              - { label: "Quote", name: "quote", widget: "text" }
              - { label: "Customer name", name: "name", widget: "string" }
              - { label: "Area (e.g. 'Market Drayton')", name: "location", widget: "string", required: false }
              - { label: "Star rating (1-5)", name: "rating", widget: "number", default: 5, min: 1, max: 5 }
